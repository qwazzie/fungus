<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Грибофон</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone">
    <!-- Список чатов -->
    <section id="s-list" class="screen">
      <header class="topbar">
        <h1 class="title">ГРИБОФОН</h1>
        <div class="actions">
          <button id="newChat" class="chip" title="Новый чат">+</button>
          <button id="openProfile" class="chip" title="Профиль">⚙</button>
        </div>
      </header>
      <div id="chatList" class="content"></div>
    </section>

    <!-- Экран чата -->
    <section id="s-chat" class="screen" hidden>
      <header class="topbar">
        <button class="chip" data-back>← Назад</button>
        <h2 id="chatTitle" class="title">Чат</h2>
      </header>
      <div id="msgs" class="content"></div>

      <form id="composer" class="composer">
        <div id="who" class="pill" aria-expanded="false">
          <span id="whoBadge" class="badge">?</span>
          <span id="whoName" class="nm">Имя</span>
        </div>
        <input type="text" id="text" placeholder="Написать реплику..." autocomplete="off" maxlength="1000">
        <button type="submit" class="chip send">➤</button>
      </form>
    </section>

    <!-- Выпадающее меню выбора персонажа -->
    <div id="drop" class="dropdown" hidden></div>

    <!-- Экран профиля / персонажей -->
    <section id="s-profile" class="screen" hidden>
      <header class="topbar">
        <button class="chip" data-back>← Назад</button>
        <h2 class="title">Персонажи</h2>
      </header>
      <div class="content">
        <div class="card paper">
          <div id="avatar" class="avatar-box"></div>
          <button id="pickPhoto" class="pill mini">Выбрать фото</button>
          <button id="clearPhoto" class="pill mini" hidden>Убрать фото</button>
          <input type="file" id="photoFile" accept="image/*" hidden>
        </div>
        <form id="addName" class="row">
          <input type="text" id="newName" placeholder="Имя нового персонажа..." maxlength="24" autocomplete="off">
          <button type="submit" class="chip">Добавить</button>
        </form>
        <p id="nameErr" class="err"></p>
        <ul id="namesList" class="list"></ul>
      </div>
    </section>
  </div>

  <!-- Подключаем Socket.io соединенный с сервером -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
