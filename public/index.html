<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Грибофон</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone">
    <!-- Экран авторизации -->
    <section id="s-auth" class="screen">
      <header class="topbar">
        <h1 class="title">ВХОД В ГРИБОФОН</h1>
      </header>
      <div class="content auth-box">
        <div class="paper card" style="align-items: center; text-align: center;">
          <p class="body" style="margin-bottom: 12px;">Введите юзернейм, пароль и публичное имя (например, @sosiskis3 или РИН 🍄).</p>
          <form id="authForm" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
            <input type="text" id="authUsername" placeholder="Юзернейм (например, sosiskis3)" maxlength="24" required autocomplete="off">
            <input type="password" id="authPass" placeholder="Секретный пароль" required autocomplete="off">
            <input type="text" id="authDisplay" placeholder="Публичное имя (@username или роль)" maxlength="24" autocomplete="off">
            <button type="submit" class="chip" style="justify-content: center;">Войти / Создать</button>
            <p id="authErr" class="err"></p>
          </form>
        </div>
      </div>
    </section>

    <!-- Список чатов -->
    <section id="s-list" class="screen" hidden>
      <header class="topbar">
        <h1 class="title">ГРИБОФОН</h1>
        <div class="actions">
          <button id="newChat" class="chip" title="Новый чат">+</button>
          <button id="openProfile" class="chip" title="Профиль">⚙</button>
        </div>
      </header>
      <div id="chatList" class="content"></div>
    </section>

    <!-- Экран чата -->
    <section id="s-chat" class="screen" hidden>
      <header class="topbar">
        <button class="chip" data-back>← Назад</button>
        <h2 id="chatTitle" class="title">Чат</h2>
      </header>
      <div id="msgs" class="content"></div>

      <form id="composer" class="composer">
        <div class="pill" style="cursor: default;">
          <span id="whoBadge" class="badge">?</span>
          <span id="whoName" class="nm">Имя</span>
        </div>
        <input type="text" id="text" placeholder="Написать реплику..." autocomplete="off" maxlength="1000">
        <button type="submit" class="chip send">➤</button>
      </form>
    </section>

    <!-- Экран профиля -->
    <section id="s-profile" class="screen" hidden>
      <header class="topbar">
        <button class="chip" data-back>← Назад</button>
        <h2 class="title">Профиль</h2>
      </header>
      <div class="content">
        <div class="paper card">
          <span class="ntag" id="profileTag">Аккаунт</span>
          <p id="profileUser" class="body" style="margin-top: 6px;"></p>
        </div>
        <button id="logoutBtn" class="chip" style="width: 100%; justify-content: center; background: #f8d7da;">Сменить аккаунт</button>
      </div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
